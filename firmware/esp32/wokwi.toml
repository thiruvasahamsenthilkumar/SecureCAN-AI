# Wokwi simulator configuration.
#
# Wokwi runs the SAME .elf that PlatformIO just built for a real ESP32 -- it is a
# cycle-level simulator of the chip, not a re-implementation of the code. So the
# serial output below is the firmware actually executing, and the microsecond
# figures come from the simulated ESP32's own micros().
#
# They are still SIMULATED timings, and the README says so. Wokwi models the
# instruction set and peripheral timing but not flash-cache misses or SPI RAM
# latency, so on real silicon expect the same order of magnitude, not the same
# number to three digits.
#
# To capture the device numbers (per-frame latency, recall, FPR):
#
#   cd firmware/esp32
#   pio run                                    # produces the .elf below
#   export WOKWI_CLI_TOKEN=...                 # from wokwi.com/dashboard/ci
#   wokwi-cli . --timeout 180000 --expect-text "replay complete"
#
# The firmware replays all 1,200 frames in src/test_frames.h, prints a summary
# with mean and max microseconds per frame, then prints "replay complete --
# halting" and stops. --expect-text makes the CLI exit 0 on that line rather
# than running until the timeout, so this works unattended and in CI.
#
# On Windows PowerShell:  $env:WOKWI_CLI_TOKEN="..."
# Or open diagram.json in the Wokwi VS Code extension and watch it interactively.
#
# Install the CLI (it is a binary, not a pip package):
#   Windows:      iwr https://wokwi.com/ci/install.ps1 -useb | iex
#   Linux/macOS:  curl -L https://wokwi.com/ci/install.sh | sh

[wokwi]
version = 1
firmware = ".pio/build/esp32dev/firmware.bin"
elf = ".pio/build/esp32dev/firmware.elf"
