; SecureCAN AI -- ESP32 firmware build.
;
;   cd firmware/esp32
;   pio run                  # compile
;   pio run -t upload        # flash a real board
;   pio device monitor       # watch the serial output
;
; For the Wokwi simulator, build first, then open diagram.json in the Wokwi VS Code
; extension (wokwi.toml points at the .elf this produces). No hardware needed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; NO THIRD-PARTY LIBRARIES. This is deliberate and worth explaining.
;
; The plan was tanakamasayuki/TensorFlowLite_ESP32, the only Arduino packaging of
; TFLite Micro for this chip. It was last released in 2021 and does not compile
; against the current platform (espressif32 8.x / ESP-IDF 5.5) -- three separate
; errors: two bundled LCD drivers call IDF functions that were removed, and its
; vendored flatbuffers assigns to a const member of `span`. Pinning
; platform = espressif32@6.x would work around it by dragging the whole
; toolchain back two years, and would still leave the project on an abandoned
; library.
;
; The model is three dense layers: 1,157 int8 parameters. src/nn.h runs them
; directly in about seventy lines of integer arithmetic, and
; tests/test_parity.py checks the result against TFLite's own int8 interpreter on
; real frames, requiring the predicted class to match on every frame. So the
; dependency buys nothing here and costs reproducibility.

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; The int8 dot products are the hot path and have to fit a 250 us per-frame
    ; budget. -O2 is what makes that comfortable rather than marginal.
    -O2
    ; Treat warnings seriously on a target where a bad printf format or an
    ; implicit narrowing is a silent wrong answer, not a crash.
    -Wall
    -Wextra

; features.h, nn.h, model_int8.h, constants_data.h and test_frames.h all live in
; src/, which PlatformIO already puts on the include path.
